<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Mood Predictor screenshot placeholder</title>
  <desc id="desc">Dark dashboard placeholder with lavender, teal, and warm slider colors.</desc>
  <rect width="1200" height="760" fill="#1b1b1d"/>
  <rect x="52" y="52" width="1096" height="656" rx="18" fill="#202023" stroke="#343341"/>
  <text x="96" y="135" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="800">Mood Predictor App</text>
  <text x="99" y="185" fill="#b8bcc8" font-family="Inter, Arial, sans-serif" font-size="24">Drop the updated project screenshot in public/blog/mood-predictor/cover.png</text>
  <rect x="96" y="260" width="520" height="22" rx="11" fill="url(#slider)"/>
  <circle cx="448" cy="271" r="19" fill="#8580ed"/>
  <rect x="96" y="330" width="520" height="22" rx="11" fill="url(#slider)"/>
  <circle cx="256" cy="341" r="19" fill="#8580ed"/>
  <rect x="96" y="400" width="520" height="22" rx="11" fill="url(#slider)"/>
  <circle cx="356" cy="411" r="19" fill="#8580ed"/>
  <rect x="96" y="505" width="310" height="72" rx="12" fill="#8580ed"/>
  <text x="164" y="550" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Predict Mood</text>
  <rect x="696" y="257" width="350" height="260" rx="12" fill="#25252a" stroke="#343341"/>
  <polyline points="735,455 790,380 848,425 904,340 970,372 1012,310" fill="none" stroke="#6fcad0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="735" y="565" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Mood History + Charts</text>
  <defs>
    <linearGradient id="slider" x1="96" y1="0" x2="616" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6658c8"/>
      <stop offset="0.5" stop-color="#b452ad"/>
      <stop offset="1" stop-color="#f0c574"/>
    </linearGradient>
  </defs>
</svg>
